services:
  - type: web
    name: orangecarrier-bot
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: "apt-get update && apt-get install -y chromium chromium-driver ffmpeg && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python bot.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: CHROME_BIN
        value: /usr/bin/chromium
      - key: CHROMEDRIVER_PATH
        value: /usr/bin/chromedriver
